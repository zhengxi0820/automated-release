id: ai-basics
name: AI 小白课
enabled: true
content_type: concept   # concept = 概念科普（不走热点采集/评估）

sources: []             # 概念模式不从热点采集，选题来自 concepts/ai-basics.txt

llm:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.7
  max_tokens: 8192

writing:
  min_length: 2600
  max_length: 3400
  title_max_chars: 20
  disclaimer: ""

cardify:
  mode: flow
  use_headings: true
  section_count: 5
  canvas:
    width: 1080
    height: 1800
  layout:
    f_body: 42
    f_head: 50
    w_body: 600
    w_head: 800
    lh_body: 76
    para_gap: 30
    pad_top: 80
    pad_bottom: 120

compliance:
  block_categories: []
  block_keywords: []
  require_ai_label: true
