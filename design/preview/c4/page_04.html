<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1D1D1F; --ink-2: #6E6E73; --ink-3: #86868B; --blue: #0066CC;
  --hairline: #D2D2D7; --hl-yellow: rgba(255,204,0,.40);
  --serif: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1440px; overflow: hidden; }
body {
  font-family: var(--serif); background: #FFFFFF; color: var(--ink);
  display: flex; flex-direction: column;
  padding: 90px 130px 50px;
}
main { flex: 1; }
.hln { font-size: 45px; line-height: 90px; font-weight: 700; }
.pln { font-size: 37px; line-height: 74px; font-weight: 500; text-align: justify; text-align-last: justify; }
.pln.last { text-align-last: auto; }
</style>
</head>
<body>
<main>
<div class="pln">要说明的是：截至发稿，官方还没有确认发布时间</div>
<div class="pln">和定价，以上信息以硅基流动平台页面为准。最后</div>
<div class="pln">交代本文的信息源：平台页面、社区讨论，加上我</div>
<div class="pln">自己的使用经验。凡是没核实的地方，文中都标了</div>
<div class="pln">「未官宣」「待实测」。这不是免责声明，是阅读</div>
<div class="pln last">习惯——看 AI 资讯，先看信源，再看结论。</div>
<div style="height:74px"></div>
<div class="hln">二、1M 上下文是一本书的量</div>
<div style="height:74px"></div>

<div class="pln">献加正文加笔记，往往几十万字起步；看合同的人</div>
<div class="pln">，一个项目的合同组加上补充协议，轻松过百页；</div>
<div class="pln">写代码的人，一个中型仓库的源码加文档，也是几</div>
<div class="pln last">十万字符的量级。这些活儿，以前都得先切块。</div>

</main>

</html>
