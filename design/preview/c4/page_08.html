<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1D1D1F; --ink-2: #6E6E73; --ink-3: #86868B; --blue: #0066CC;
  --hairline: #D2D2D7; --hl-yellow: rgba(255,204,0,.40);
  --serif: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1440px; overflow: hidden; }
body {
  font-family: var(--serif); background: #FFFFFF; color: var(--ink);
  display: flex; flex-direction: column;
  padding: 90px 130px 50px;
}
main { flex: 1; }
.hln { font-size: 45px; line-height: 90px; font-weight: 700; }
.pln { font-size: 37px; line-height: 74px; font-weight: 500; text-align: justify; text-align-last: justify; }
.pln.last { text-align-last: auto; }
</style>
</head>
<body>
<main>
<div class="pln">说个我自己的场景。之前处理一份五百页的行业 P</div>
<div class="pln">DF，模型每轮只能吃进去几十页，我只好手动切</div>
<div class="pln">成十几段，一段一段喂。更麻烦的是，还得自己维</div>
<div class="pln">护一份「前面聊过什么」的摘要，每次都附在提问</div>
<div class="pln last">后面，流程又慢又容易出错。</div>
<div style="height:74px"></div>
<div class="pln">当时的流程大致是这样：先把 PDF 按章节切块、</div>
<div class="pln">编号；每次提问，附上问题相关的两三块，再贴一</div>
<div class="pln">段滚动摘要；模型答完，手动把新结论补回摘要。</div>
<div class="pln">一次完整的追问，来回要折腾半小时，精力全花在</div>
<div class="pln last">「喂」上，而不是「想」上。</div>
<div style="height:74px"></div>
<div class="pln">最气人的是，很多结论偏偏藏在对照里。第 12 页</div>
<div class="pln">的一个数字，要对上第 300 页的一句表述，切块</div>
<div class="pln">喂的时候，这两段根本不在同一个对话里，模型想</div>
<div class="pln last">帮也对不上。</div>
<div style="height:74px"></div>
</main>
</body>
</html>
