<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1D1D1F; --ink-2: #6E6E73; --ink-3: #86868B; --blue: #0066CC;
  --hairline: #D2D2D7; --hl-yellow: rgba(255,204,0,.40);
  --serif: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1440px; overflow: hidden; }
body {
  font-family: var(--serif); background: #FFFFFF; color: var(--ink);
  display: flex; flex-direction: column;
  padding: 90px 130px 50px;
}
main { flex: 1; }
.hln { font-size: 45px; line-height: 90px; font-weight: 700; }
.pln { font-size: 37px; line-height: 74px; font-weight: 500; text-align: justify; text-align-last: justify; }
.pln.last { text-align-last: auto; }
</style>
</head>
<body>
<main>
<div class="pln">第二是成本。长上下文按输入量计费是行业常态，</div>
<div class="pln">1M 全喂满，账单未必比想象中友好。尝鲜的时候</div>
<div class="pln">，建议先看一眼定价页，再用小文件试水，别一上</div>
<div class="pln last">来就整本教材往里灌。</div>
<div style="height:74px"></div>
<div class="pln">第三是生态。围绕旧模型的客户端、工作流、提示</div>
<div class="pln">词库，要不要跟进适配，迁移的隐性成本要算总账</div>
<div class="pln">。参数翻十倍，不等于你的整套流程收益翻十倍，</div>
<div class="pln last">中间隔着工具链的磨合。</div>
<div style="height:74px"></div>
<div class="pln">另外给重度用户提个醒：如果你的工具链里已经有</div>
<div class="pln">围绕旧模型调好的提示词和参数，别急着全套照搬</div>
<div class="pln">。长上下文下，提示词的位置、示例的排布，都可</div>
<div class="pln last">能影响效果，值得重新做一轮小规模对比。</div>
<div style="height:74px"></div>
</main>
</body>
</html>
