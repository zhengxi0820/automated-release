<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1D1D1F; --ink-2: #6E6E73; --ink-3: #86868B; --blue: #0066CC;
  --hairline: #D2D2D7; --hl-yellow: rgba(255,204,0,.40);
  --serif: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1440px; overflow: hidden; }
body {
  font-family: var(--serif); background: #FFFFFF; color: var(--ink);
  display: flex; flex-direction: column;
  padding: 90px 130px 50px;
}
main { flex: 1; }
.hln { font-size: 45px; line-height: 90px; font-weight: 700; }
.pln { font-size: 37px; line-height: 74px; font-weight: 500; text-align: justify; text-align-last: justify; }
.pln.last { text-align-last: auto; }
</style>
</head>
<body>
<main>
<div style="height:74px"></div>
<div class="pln">多说一句「一本书」的直觉：人读一本书是线性地</div>
<div class="pln">读，读完形成整体理解；模型读一本书，更像是把</div>
<div class="pln">整本书摊开在桌面上，随时抽查任何一页。这两种</div>
<div class="pln">「读过」不一样——模型的优势是随机访问，劣势</div>
<div class="pln">是未必有整体感。所以长上下文要配好问题，你得</div>
<div class="pln last">知道自己要抽哪一页。</div>
<div style="height:74px"></div>
<div class="pln">当然，也别把「塞得进」当成「读得懂」。文本进</div>
<div class="pln">窗口只是第一步，理解、关联、推理是另一回事。</div>
<div class="pln">就像图书馆进了新书，书架够大是好事，但能不能</div>
<div class="pln">找到、能不能读懂，还得看检索的人。这个比喻糙</div>
<div class="pln last">了点，方向没错。</div>
<div style="height:74px"></div>
</main>
</body>
</html>
