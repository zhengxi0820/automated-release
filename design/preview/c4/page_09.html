<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1D1D1F; --ink-2: #6E6E73; --ink-3: #86868B; --blue: #0066CC;
  --hairline: #D2D2D7; --hl-yellow: rgba(255,204,0,.40);
  --serif: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1440px; overflow: hidden; }
body {
  font-family: var(--serif); background: #FFFFFF; color: var(--ink);
  display: flex; flex-direction: column;
  padding: 90px 130px 50px;
}
main { flex: 1; }
.hln { font-size: 45px; line-height: 90px; font-weight: 700; }
.pln { font-size: 37px; line-height: 74px; font-weight: 500; text-align: justify; text-align-last: justify; }
.pln.last { text-align-last: auto; }
</style>
</head>
<body>
<main>
<div class="pln">有人会说，用检索也能解决长文档问题，何必非要</div>
<div class="pln">长上下文。我的体感是：检索适合「答案就在某几</div>
<div class="pln">段」的点到点问题；长上下文适合「答案散落全文</div>
<div class="pln">」的汇总型问题。两个能力是互补的，不是替代关</div>
<div class="pln last">系。这次更新，补的是后一块的短板。</div>
<div style="height:74px"></div>
<div class="pln">如果 V4 Pro 的 1M 上下文真的稳定，这类活儿的</div>
<div class="pln">做法就变成了：整份文件直接扔进去，让它自己从</div>
<div class="pln">头读到尾，再回答问题。省掉的不只是切割的时间</div>
<div class="pln">，还有分段导致的信息丢失——这部分损失平时看</div>
<div class="pln last">不见，出错的时候才知道疼。</div>
<div style="height:74px"></div>
</main>
</body>
</html>
